plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.accountaudit'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

/**
 * Launches a full RuneLite client with this plugin loaded — the standard way plugin
 * developers test on their own account:  gradlew.bat runClient
 */
tasks.register('runClient', JavaExec) {
    group = 'runelite'
    description = 'Run RuneLite with the Account Audit plugin loaded'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.accountaudit.AccountAuditPluginTest'
    jvmArgs = ['-ea']
}
